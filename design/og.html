<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card — Toufiq EL-Dik</title>
<link rel="stylesheet" href="../public/fonts.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #fbfaf7;
    color: #111114;
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 1200px;
    height: 630px;
    padding: 58px 64px 54px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      radial-gradient(52% 78% at 84% 4%, rgba(173, 68, 32, 0.10), transparent 70%),
      radial-gradient(40% 60% at 2% 0%, rgba(17, 17, 20, 0.06), transparent 72%);
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: #111114;
    color: #fbfaf7;
    display: grid;
    place-items: center;
    font-family: "Inter Tight", sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.02em;
  }
  .name {
    font-family: "Inter Tight", sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -0.026em;
  }
  .handle {
    margin-left: auto;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: #8b8b94;
  }

  h1 {
    margin: 0;
    font-family: "Inter Tight", sans-serif;
    font-weight: 600;
    font-size: 62px;
    line-height: 1.02;
    letter-spacing: -0.038em;
  }
  h1 span { color: #ad4420; }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #8b8b94;
  }
  .eyebrow::before {
    content: "";
    width: 18px;
    height: 1px;
    background: #ad4420;
  }

  .thumbs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .thumbs img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    object-position: top center;
    border: 1px solid rgba(17, 17, 20, 0.12);
    border-radius: 11px;
    box-shadow: 0 1px 2px rgba(17, 17, 20, 0.05), 0 16px 32px -20px rgba(17, 17, 20, 0.34);
    background: #f2f1ee;
  }
</style>
</head>
<body>
  <div class="card">
    <header>
      <span class="mark">T</span>
      <span class="name">Toufiq EL-Dik</span>
      <span class="handle">github.com/toufiqeldik</span>
    </header>

    <div>
      <p class="eyebrow">Portfolio — three live projects</p>
      <h1>Clean websites,<br><span>built by hand.</span></h1>
    </div>

    <div class="thumbs">
      <img src="../public/work/burgerbox-desktop.jpg" alt="">
      <img src="../public/work/thecut-desktop.jpg" alt="">
      <img src="../public/work/flowule-desktop.jpg" alt="">
    </div>
  </div>
</body>
</html>
